
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestion de Causas MEDFA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #f1f3f5;
            color: #333333;
        }

        header {
            padding: 24px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #d5d5d5;
        }

        .encabezado {
            max-width: 1200px;
            margin: 0 auto;
        }

        .encabezado h1 {
            margin: 0;
            color: #245b8f;
            font-size: 27px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 5px;
        }

        .login h2 {
            margin: 0 0 10px;
            color: #245b8f;
            text-align: center;
            font-size: 23px;
        }

        .descripcion {
            margin: 0 0 30px;
            color: #666666;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #245b8f;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;
            background-color: #fcebea;
            border: 1px solid #e5b7b5;
            border-radius: 4px;
            color: #b42318;
            text-align: center;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 4px;
            background-color: #245b8f;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #19466f;
        }

        footer {
            padding: 20px;
            background-color: #ffffff;
            border-top: 1px solid #d5d5d5;
            color: #666666;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .encabezado h1 {
                font-size: 22px;
            }

            .login {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="encabezado">
            <h1>Sistema de Gestion de Causas MEDFA</h1>
        </div>
    </header>

    <main>
        <section class="login">
            <h2>Iniciar sesion</h2>

            <p class="descripcion">
                Ingrese sus credenciales para acceder al sistema.
            </p>

            <form method="POST">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="error">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="campo">
                    <label for="rut">RUT</label>
                    <input
                        type="text"
                        id="rut"
                        name="rut"
                        placeholder="Ingrese su RUT"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">ClaveUnica</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su clave unica"
                        required
                    >
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <footer>
        MEDFA - Sistema de Gestión de Causas
    </footer>
</body>
</html>
